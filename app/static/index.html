<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backup Manager</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <section id="login-view" class="login-view hidden">
    <form id="login-form" class="login-form">
      <h1>Backup Manager</h1>
      <label>Username<input type="text" id="login-username" autocomplete="username" required /></label>
      <label>Password<input type="password" id="login-password" autocomplete="current-password" required /></label>
      <button type="submit">Log in</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </section>

  <div id="app-view" class="app-view hidden">
    <header class="topbar">
      <h1>Backup Manager</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="jobs">Jobs</button>
        <button class="tab-btn" data-tab="history">History &amp; Logs</button>
      </nav>
      <div class="topbar-right">
        <button id="notif-btn" class="icon-btn">🔔 <span id="notif-count" class="badge hidden">0</span></button>
        <button id="logout-btn" class="link-btn">Log out</button>
      </div>
    </header>

    <main>
      <section id="jobs-tab" class="tab-panel">
        <div class="panel-header">
          <h2>Jobs</h2>
          <button id="create-job-btn" class="primary-btn">+ Create Job</button>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th><th>Type</th><th>Source</th><th>Destination</th><th>Last Run</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="jobs-tbody"></tbody>
        </table>
      </section>

      <section id="history-tab" class="tab-panel hidden">
        <div class="panel-header">
          <h2>History &amp; Logs</h2>
          <div class="filters">
            <select id="filter-job"><option value="">All jobs</option></select>
            <select id="filter-status">
              <option value="">All statuses</option>
              <option value="running">Running</option>
              <option value="success">Success</option>
              <option value="failed">Failed</option>
            </select>
          </div>
        </div>
        <table class="data-table">
          <thead>
            <tr><th>Job</th><th>Start</th><th>End</th><th>Duration</th><th>Status</th></tr>
          </thead>
          <tbody id="runs-tbody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div id="job-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="job-modal-title">Create Job</h2>
      <form id="job-form">
        <input type="hidden" id="job-id" />
        <label>Name<input type="text" id="job-name" required /></label>
        <label>Description<textarea id="job-description"></textarea></label>

        <fieldset>
          <legend>Backup Type</legend>
          <select id="job-backup-type">
            <option value="sql">SQL Backup</option>
            <option value="s3">S3 Sync/Copy</option>
            <option value="filecopy">File Copy</option>
          </select>
        </fieldset>

        <div id="sql-fields" class="type-fields hidden">
          <label>DB Engine
            <select id="sql-engine"><option value="postgresql">PostgreSQL</option><option value="mysql">MySQL</option><option value="mssql">MSSQL</option></select>
          </label>
          <label>Host<input type="text" id="sql-host" /></label>
          <label>Port<input type="number" id="sql-port" /></label>
          <label>Database<input type="text" id="sql-database" /></label>
          <label>Username<input type="text" id="sql-username" /></label>
          <label>Password<input type="password" id="sql-password" /></label>
          <label>Output Format
            <select id="sql-output-format"><option value="sql">.sql</option><option value="gz">.sql.gz</option></select>
          </label>
        </div>

        <div id="s3job-fields" class="type-fields hidden">
          <label>Mode
            <select id="s3job-mode"><option value="copy">copy</option><option value="sync">sync</option></select>
          </label>
          <label>Direction
            <select id="s3job-direction"><option value="upload">Upload (local → S3)</option><option value="download">Download (S3 → local)</option></select>
          </label>
        </div>

        <div id="filecopy-fields" class="type-fields hidden">
          <label>Mode
            <select id="filecopy-mode"><option value="rsync">rsync</option><option value="xcopy">xcopy</option></select>
          </label>
          <label class="checkbox-label"><input type="checkbox" id="filecopy-delete" /> Delete removed files (rsync only)</label>
        </div>

        <fieldset>
          <legend>Source</legend>
          <select id="job-source-type">
            <option value="local">Local</option>
            <option value="nfs">NFS</option>
            <option value="smb">SMB/CIFS</option>
            <option value="s3">S3</option>
          </select>
          <div id="source-config"></div>
        </fieldset>

        <fieldset>
          <legend>Destination</legend>
          <select id="job-destination-type">
            <option value="local">Local</option>
            <option value="nfs">NFS</option>
            <option value="smb">SMB/CIFS</option>
            <option value="s3">S3</option>
          </select>
          <div id="destination-config"></div>
        </fieldset>

        <label class="checkbox-label"><input type="checkbox" id="job-notify-success" /> Notify on success (in addition to failure)</label>
        <label class="checkbox-label"><input type="checkbox" id="job-enabled" checked /> Enabled</label>

        <div class="modal-actions">
          <button type="button" id="job-cancel-btn" class="secondary-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save Job</button>
        </div>
      </form>
    </div>
  </div>

  <div id="log-modal" class="modal hidden">
    <div class="modal-content wide">
      <h2>Run Log</h2>
      <pre id="log-content" class="log-viewer"></pre>
      <div class="modal-actions">
        <button type="button" id="log-close-btn" class="secondary-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
